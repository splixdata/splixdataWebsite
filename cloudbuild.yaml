# Cloud Build configuration for automated deployment to Cloud Run
# Triggers on push to main branch

substitutions:
  _REGION: 'us-central1'

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/splixdata-site:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/splixdata-site:latest'
      - '.'

  # Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/splixdata-site'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'splixdata-site'
      - '--image'
      - 'gcr.io/$PROJECT_ID/splixdata-site:latest'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/splixdata-site'

# Build timeout (10 minutes)
timeout: '600s'

# Use Cloud Build's high-performance machine type
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Cloud Build configuration for automated deployment to Cloud Run
# Triggers on push to main branch

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/splixdata-site/splixdata-site:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/splixdata-site/splixdata-site:latest'
      - '.'

  # Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/splixdata-site/splixdata-site'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'splixdata-site'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/splixdata-site/splixdata-site:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

# Store images in Google Container Registry
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/splixdata-site/splixdata-site'

# Build timeout (10 minutes)
timeout: '600s'

# Use Cloud Logging only
options:
  logging: CLOUD_LOGGING_ONLY
